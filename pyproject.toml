[project]
name = "talea"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]

# Coverage gate lives in CI (see .github/workflows/ci.yml). The floor is a
# RATCHET: raised as surfaces gain tests, never lowered. It covers the core
# package AND the production-critical scripts (the dashboard the public reads,
# the independent ledger re-derivation, the R1 promotion test, the weekly
# two-route corruption guard, the OTS immutability auditor). Only the
# analysis-only scripts (backtests, the founding-probe reproduction) are
# human-run and omitted from the gate.
[tool.coverage.run]
source = ["src/talea", "scripts"]
omit = [
    "scripts/backtest_baselines.py",
    "scripts/backtest_markets.py",
    "scripts/probe_signal.py",
    "scripts/calibrate_sign_bar.py",   # one-time, numpy/statsmodels/arch (not stdlib)
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talea"]
